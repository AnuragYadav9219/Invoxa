spring.application.name=${APP_NAME:Invoxa}

# ===============================
# SERVER CONFIG
# ===============================
server.port=${PORT:8080}


# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/invoice_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE CONFIG
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100


# ===============================
# LOG CONFIG
# ===============================

logging.level.root=INFO
logging.level.com.invoice.tracker=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


# ===============================
# MONITORING CONFIG
# ===============================

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


# ===============================
# MAIL CONFIG
# ===============================

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_app_password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ===============================
# JWT CONFIG
# ===============================

jwt.secret=${JWT_SECRET:change-this-secret-key}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION:604800000}

app.refresh-cookie-age=${APP_REFRESH_COOKIE_AGE:604800}


# ===============================
# FILE UPLOAD
# ===============================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# ===============================
# FRONTEND
# ===============================

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}


# ===============================
# THYMELEAF
# ===============================

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false


# ===============================
# PRINT TOKEN
# ===============================

app.print.secret=${APP_PRINT_SECRET:change-this-print-secret}
app.print.expiration=${APP_PRINT_EXPIRATION:300000}


# ===============================
# RAZORPAY
# ===============================

razorpay.key-id=${RAZORPAY_KEY_ID:test}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:test}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:test}


# ===============================
# CLOUDINARY
# ===============================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:test}
cloudinary.api-key=${CLOUDINARY_API_KEY:test}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:test}


# ===============================
# COOKIE
# ===============================

app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}


# ===============================
# RESEND KEY
# ===============================

resend.api-key=${RESEND_API_KEY:test}
resend.from=${RESEND_FROM}

support.admin.email=${SUPPORT_ADMIN_EMAIL}