spring.application.name=Invoxa_Test

# ===============================
# SERVER CONFIG
# ===============================
server.port=8080


# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver


# ===============================
# JPA / HIBERNATE CONFIG
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ===============================
# LOG CONFIG
# ===============================

logging.level.root=WARN
logging.level.com.invoice.tracker=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


# ===============================
# MONITORING CONFIG
# ===============================

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


# ===============================
# MAIL CONFIG
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test_email@gmail.com
spring.mail.password=test_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ===============================
# JWT / TOKENS CONFIG
# ===============================

jwt.secret=test_secret_key_for_testing_purposes_only_should_be_long_enough
jwt.expiration=86400000
jwt.refreshExpiration=604800000
app.refresh-cookie-age=604800


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.frontend.url=http://localhost:8080
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false


# ===============================
# PRINT TOKEN CONFIG - REQUIRED
# ===============================

app.print.secret=test_print_secret_key_for_testing_that_is_long_enough_for_256_bit_hmac
app.print.expiration=300000


# ===============================
# RAZORPAY CONFIG
# ===============================

razorpay.key-id=test_razorpay_key_id
razorpay.key-secret=test_razorpay_key_secret
razorpay.webhook-secret=test_razorpay_webhook


# ===============================
# CLOUDINARY CONFIG
# ===============================

cloudinary.cloud-name=test_cloudinary_name
cloudinary.api-key=test_cloudinary_api_key
cloudinary.api-secret=test_cloudinary_api_secret


# ===============================
# COOKIE CONFIG
# ===============================

app.cookie.secure=false
app.cookie.same-site=Lax
